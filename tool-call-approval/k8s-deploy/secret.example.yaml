# Copy to secret.yaml, replace every placeholder, and apply it separately.
# secret.yaml is ignored by Git and must not be committed.
apiVersion: v1
kind: Secret
metadata:
  name: tool-call-approval-secrets
  namespace: tool-call-approval
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  POSTGRES_URL: postgresql+psycopg2://postgres:replace-me@postgres:5432/postgres
  REGISTRATION_DATABASE_URL: postgresql+psycopg2://postgres:replace-me@postgres:5432/registration
  JWT_SECRET_KEY: replace-me
  OPENAI_API_KEY: replace-me
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
