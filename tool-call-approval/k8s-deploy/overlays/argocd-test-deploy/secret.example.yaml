# Copy to secret.yaml, replace values, and apply separately. This file is not
# included in kustomization.yaml so credentials are never committed or managed
# by Argo CD.
apiVersion: v1
kind: Secret
metadata:
  name: tool-call-approval-secrets
  namespace: argocd-test-deploy
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-me
  POSTGRES_URL: postgresql+psycopg2://postgres:replace-me@postgres:5432/postgres
  REGISTRATION_DATABASE_URL: postgresql+psycopg2://postgres:replace-me@postgres:5432/registration
  JWT_SECRET_KEY: replace-me
